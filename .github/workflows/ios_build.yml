name: Build iOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-ios:
    name: Build iOS IPA Package
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter & Xcode Environment
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build iOS Application (Release Mode)
        working-directory: frontend
        run: flutter build ios --release --no-codesign

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r frontend/build/ios/iphoneos/Runner.app Payload/
          zip -r DigiGuide-iOS.ipa Payload
          ls -lh DigiGuide-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiGuide-iOS-Build
          path: DigiGuide-iOS.ipa
          retention-days: 14
